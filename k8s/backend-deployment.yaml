apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-hms
  labels:
    app: backend-hms
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-hms
  template:
    metadata:
      labels:
        app: backend-hms
    spec:
      containers:
      - name: backend
        image: your-registry/hospital-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: DB_HOST
          value: "mongodb-host"
        - name: DB_PORT
          value: "27017"
        - name: DB_NAME
          value: "hospital_db"
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-credentials
              key: password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: jwt-secret
              key: secret
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
      imagePullSecrets:
      - name: regcred
